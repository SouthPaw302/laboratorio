name: Marine Mesh Android (prototype)
on:
  workflow_dispatch:
  push:
    branches: [project/marine-mesh]
    paths:
      - 'projects/marine-mesh/**'
      - '.github/workflows/marine-mesh-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/marine-mesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build web frontend
        run: cd web && npm install && npm run build
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: marine-mesh-debug-apk
          path: projects/marine-mesh/android/app/build/outputs/apk/debug/app-debug.apk
